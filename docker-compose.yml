version: '3.8'

services:
  app:
    build: .
    image: noc-monitor:latest
    container_name: noc-monitor
    restart: unless-stopped
    ports:
      - "3200:3200"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
