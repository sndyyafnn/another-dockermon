services:
  dockermon:
    build: .
    image: dockermon:latest
    container_name: dockermon
    restart: unless-stopped
    ports:
      - "3200:3200"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${DOCKER_GID:-988}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
