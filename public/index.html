<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dockermon — Real-time Docker container monitoring and infrastructure management platform.">
  <title>Dockermon — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <!-- CRT overlay effects (aria-hidden so they don't interfere with screen readers) -->
  <div class="crt-scanlines" aria-hidden="true"></div>
  <div class="crt-vignette"  aria-hidden="true"></div>
  <div class="crt-noise"     aria-hidden="true"></div>

  <!-- App shell -->
  <div id="app" class="app-shell">

    <!-- ── Top Bar ──────────────────────────────────────────── -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
          <i class="ph ph-list"></i>
        </button>
        <div class="brand">
          <span class="brand-mark">◈</span>
          <span class="brand-name">DOCKERMON</span>
        </div>
      </div>
      <div class="topbar-center" id="host-status-bar">
        <!-- Populated by JS -->
      </div>
      <div class="topbar-right">
        <div class="topbar-clock" id="topbar-clock">--:--:--</div>
        <div class="topbar-user" id="topbar-user">
          <span class="user-role-badge" id="user-role-badge">--</span>
          <span id="user-name-display">--</span>
        </div>
        <button class="logout-btn" id="logout-btn" title="Logout">
          <i class="ph ph-sign-out"></i>
        </button>
      </div>
    </header>

    <!-- ── Sidebar Nav ──────────────────────────────────────── -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="nav-section-label">// MONITOR</div>
        <ul class="nav-list" id="nav-list">
          <li>
            <a href="#overview" class="nav-link" data-page="overview" id="nav-overview">
              <i class="ph ph-chart-bar"></i>
              <span class="nav-label">OVERVIEW</span>
            </a>
          </li>
          <li>
            <a href="#containers" class="nav-link" data-page="containers" id="nav-containers">
              <i class="ph ph-cube"></i>
              <span class="nav-label">CONTAINERS</span>
            </a>
          </li>
          <li>
            <a href="#logs" class="nav-link" data-page="logs" id="nav-logs">
              <i class="ph ph-terminal-window"></i>
              <span class="nav-label">LOGS</span>
            </a>
          </li>
        </ul>

        <div class="nav-section-label admin-only" id="nav-section-admin">// ADMIN</div>
        <ul class="nav-list admin-only" id="nav-list-admin">
          <li>
            <a href="#settings" class="nav-link" data-page="settings" id="nav-settings">
              <i class="ph ph-sliders-horizontal"></i>
              <span class="nav-label">SETTINGS</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <div class="docker-status" id="docker-status">
            <span class="status-dot" id="docker-dot"></span>
            <span class="nav-label" id="docker-status-text">DOCKER</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- ── Main Content ─────────────────────────────────────── -->
    <main class="main-content" id="main-content">
      <div id="page-container">
        <!-- Pages rendered here by router -->
        <div class="loading-screen" id="loading-screen">
          <div class="loading-inner">
            <div class="loading-logo">◈ DOCKERMON</div>
            <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
            <div class="loading-text" id="loading-text">INITIALIZING...</div>
          </div>
        </div>
      </div>
    </main>

  </div><!-- /.app-shell -->

  <!-- Modal container -->
  <div id="modal-container" aria-live="polite"></div>

  <!-- JS modules in dependency order -->
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/state.js"></script>
  <script type="module" src="/js/router.js"></script>
  <script type="module" src="/js/charts.js"></script>
  <script type="module" src="/js/components/nav.js"></script>
  <script type="module" src="/js/components/log-viewer.js"></script>
  <script type="module" src="/js/components/modal.js"></script>
  <script type="module" src="/js/pages/overview.js"></script>
  <script type="module" src="/js/pages/containers.js"></script>
  <script type="module" src="/js/pages/container-detail.js"></script>
  <script type="module" src="/js/pages/logs.js"></script>
  <script type="module" src="/js/pages/settings.js"></script>
  <script type="module" src="/js/pages/guest-dashboard.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
